name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN needs write access to push the built site to gh-pages
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # The site is plain HTML/CSS, so "building" is just collecting the
      # files that should be public. Anything not copied here stays out of
      # the deployed branch (workflows, README, scratch files).
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml favicon.ico favicon.svg \
             favicon-32.png favicon-192.png apple-touch-icon.png _site/
          cp -r assets research about _site/
          touch _site/.nojekyll
          ls -R _site

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
